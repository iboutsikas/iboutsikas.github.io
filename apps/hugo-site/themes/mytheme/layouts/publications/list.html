{{ define "main" }}
<div class="publications-listing">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
  </header>

  <div class="publications-list">
    {{ range .Pages.ByDate.Reverse }}
    {{ partial "pub-entry.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
