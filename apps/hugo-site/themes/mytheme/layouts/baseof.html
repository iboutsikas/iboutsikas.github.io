<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <ib-coverpage id="_coverpage" side="left">
    {{ partial "sidebar.html" .}}
  </ib-coverpage>

  <main id="_content">
    <h1>{{ site.Title }}</h1>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
