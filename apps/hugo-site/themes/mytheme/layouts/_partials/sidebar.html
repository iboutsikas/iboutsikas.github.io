<ib-coverpage id="_coverpage" side="left" open>

  <div class="sidebar-container">
    {{ with .Site.Params.sidebar_bg }}
    <div class="sidebar-bg" style="--sidebar-bg-image: url({{ . | relURL }})"></div>
    {{ end }}

    <div class="sidebar-sticky">
      <div class="sidebar-about">
        <a href="{{ .Site.BaseURL }}">
          {{ with .Site.Params.logo }}
          <img src="{{ . | relURL }}" class="avatar" alt="{{ $.Site.Title }}">
          {{ end }}
          <h1 class="site-title">{{ .Site.Title }}</h1>
          {{ with .Site.Params.tagline }}
          <p class="site-tagline">{{ . }}</p>
          {{ end }}
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        {{ partial "menu.html" . }}
      </nav>

      {{ with .Site.Params.social }}
      <div class="sidebar-social">
        {{ range . }}
        <a href="{{ .url }}" class="social-link" aria-label="{{ .title }}"{{ if not (hasPrefix .url "/") }} rel="noopener noreferrer" target="_blank"{{ end }}>
          <span class="{{.icon}}"></span>
          <span class="sr-only">{{ .title }}</span>
        </a>
        {{ end }}
      </div>
      {{ end }}

      <button class="theme-toggle" id="_theme-toggle" aria-label="Toggle dark/light theme" aria-pressed="false">
        <span class="theme-toggle__icon theme-toggle__icon--dark" aria-hidden="true">
          <i class="ph ph-moon"></i>
        </span>
        <span class="theme-toggle__icon theme-toggle__icon--light" aria-hidden="true">
          <i class="ph ph-sun"></i>
        </span>
      </button>
    </div>
  </div>

</ib-coverpage>
