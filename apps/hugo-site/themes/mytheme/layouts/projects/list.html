{{ define "main" }}
<div class="projects-listing">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
  </header>

  <div class="projects-grid">
    {{ range .Pages.ByDate.Reverse }}
    {{ partial "project-card.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
