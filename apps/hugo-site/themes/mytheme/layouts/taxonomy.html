{{ define "main" }}
<div class="page-content">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>
  <ul class="term-list">
    {{ range .Pages }}
    <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a> ({{ .Data.Term }})</li>
    {{ end }}
  </ul>
</div>
{{ end }}
